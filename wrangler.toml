name = "nix-cache-rs"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-28"

[build]
command = "worker-build --release"

[vars]
bucket_name = "nix-cache"
github_username = "plaflamme"
public_key = "yDyyH9niunKMvnwckcYDoXbvzc7NqZGUmBa9aE6UOXg="

[secrets]
required = [
    "R2_ENDPOINT",
    "R2_ACCESS_KEY_ID",
    "R2_SECRET_ACCESS_KEY",
    "AUTH_TOKEN",
    "SIGNING_PRIVATE_KEY",
]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[r2_buckets]]
bucket_name = "nix-cache"
binding = "nix-cache-bucket"
