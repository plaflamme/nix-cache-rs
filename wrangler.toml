name = "nix-cache-rs"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"

[build]
command = "worker-build --release"

[vars]
bucket_name = "nix-cache"

[secrets]
required = [
    "R2_ENDPOINT",
    "R2_ACCESS_KEY_ID",
    "R2_SECRET_ACCESS_KEY",
    "AUTH_TOKEN",
    "SIGNING_PUBLIC_KEY",
    "SIGNING_PRIVATE_KEY",
]

[[r2_buckets]]
bucket_name = "nix-cache"
binding = "nix-cache-bucket"
local_dev = { "experimental_s3_credentials" = { "accessKeyId" = "mock-local-key", "secretAccessKey" = "mock-local-secret" } }

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
